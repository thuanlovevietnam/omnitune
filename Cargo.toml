[package]
name = "omnitune"
version = "0.1.0"
edition = "2024"
authors = ["thuanlovevietnam <thuanlovevietnam@gmail.com>"]
license = "Proprietary"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "links"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.1"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 1
lto = false

[build-dependencies]
winres = "0.1.12"
